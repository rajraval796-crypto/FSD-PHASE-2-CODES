<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMPLES</title>
    <style>
        .d1{
            height: 100px;
            width: 150px;
            background-color: red;

        }
        p{
            font-size: 20px;
            color: blue;

        }
        .d1:hover{
            background-color: green;
        }

        p:hover::first-letter{
            font-size: 50px;
            color: blueviolet;
            
        }
        p:hover{
            padding: 30px 20px;
            border: 4px dotted green;
            color: yellow;
            font-style: italic;
            font-weight: bold;
            text-indent: 30px;
            text-transform: uppercase;

        }
        h1:active{
            font-size: 50px;
            text-shadow: 2px 2px 2px blue;
        }
        h1:hover::before{
            content: "😊😊";
        }
        h1:hover::after{
            content: " FSD-1";
        }
        h1::selection{
            background-color: lightblue;
            color: pink;
        }
        #textbox:focus{
            width: 20px;
            background-color: pink;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="d1"></div>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Perspiciatis autem labore earum ea repellendus hic, ab non facere qui ipsam exercitationem, quod accusantium. Cupiditate debitis molestias reprehenderit consequuntur accusamus ratione?</p>
    <h1 style="color: red;"> PRACTICE FOR T2 EXAM</h1>
    <input type="text" id="textbox">
</body>
</html>
