<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARIABLE</title>
    <style>
        :root
        {
            --b:#1234EG;
            --all: solid dashed double dotted ;
            --p20: 20px;
        }
        p{
            --c:center;
            --b:brown;
            border-style: var(--all);
            padding: var(--p20);
            border-color: var(--b);
        }
        h1{
            color: var(--b);
            text-align: var(--c);
        }
    </style>
</head>
<body>
    <h1>HELLO WORLD</h1>
    <p> GOOD MORNING</p>
</body>
</html>
